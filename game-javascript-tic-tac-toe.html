<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 30% 10%,#1e3e4a,#0a121f 65%);color:#eef6ff;font:16px/1.5 system-ui;min-height:100vh}header{max-width:1050px;margin:auto;padding:22px;display:flex;justify-content:space-between}a{color:#93e9c8}main{max-width:470px;margin:25px auto;padding:25px;background:#142333;border:1px solid #355069;border-radius:20px;box-shadow:0 25px 80px #0004}h1{font-size:30px;margin:0 0 12px}button{font:inherit;cursor:pointer;border:1px solid #365368;color:#edf8ff;background:#223b50;border-radius:10px}button:hover{background:#33566d}button:focus-visible{outline:3px solid #97f6d4}#history{text-align:right;color:#8faabb;min-height:24px}#display{font:clamp(22px,7vw,45px) ui-monospace;text-align:right;overflow:auto;padding:15px 0;min-height:90px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calc-grid button{padding:19px}.calc-grid .operator{background:#276a69}.calc-grid .equal{background:#91e4bd;color:#08241d}.calc-grid .zero{grid-column:span 2}.caption{font-size:13px;color:#9eb3c4}.scoreboard{display:flex;justify-content:space-around;margin:20px 0}.scoreboard div{text-align:center}.scoreboard small{display:block;color:#aac0cc}.scoreboard b{font-size:30px}.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.game-grid button{aspect-ratio:1;font-size:60px;font-weight:800}.game-grid button.X{color:#ffbc88}.game-grid button.O{color:#84e8cb}.game-grid button.win{background:#36635a}#game-status{font-size:23px;text-align:center}.actions{display:flex;justify-content:space-between;align-items:center}.actions button{padding:10px 16px}footer{max-width:470px;margin:20px auto;font-size:13px;padding:0 15px}@media(max-width:500px){main{margin:15px;border-radius:14px}.calc-grid button{padding:15px}}</style></head><body><header><a href="sports.html">Sports & Games</a><span>Interactive project</span></header><main><h1>Three in a row</h1><div id="app"></div></main><footer><a href="https://github.com/Ishmael366/DanPortfolio.github.io/blob/main/game-react-tic-tac-toe-source.zip">Source on GitHub</a></footer><script>const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let board=Array(9).fill(null),turn='X',ai=false,scores={X:0,O:0,Draw:0};function judge(b){for(let l of lines)if(b[l[0]]&&l.every(i=>b[i]===b[l[0]]))return{winner:b[l[0]],line:l};return b.every(Boolean)?{winner:'Draw',line:[]}:null}function minimax(b,p){let j=judge(b);if(j)return j.winner==='O'?10:j.winner==='X'?-10:0;let v=[];b.forEach((x,i)=>{if(!x){b[i]=p;v.push(minimax(b,p==='O'?'X':'O'));b[i]=null}});return p==='O'?Math.max(...v):Math.min(...v)}function render(){let j=judge(board);document.querySelector('#app').innerHTML='<div class="scoreboard">'+['X','O','Draw'].map(x=>'<div><small>'+x+'</small><b>'+scores[x]+'</b></div>').join('')+'</div><div class="game-grid">'+board.map((v,i)=>'<button aria-label="Cell '+(i+1)+(v?' '+v:'')+'" data-cell="'+i+'" class="'+(v||'')+(j?.line.includes(i)?' win':'')+'" '+(v||j?'disabled':'')+'>'+(v||'')+'</button>').join('')+'</div><p id="game-status" role="status">'+(j?j.winner==='Draw'?'Draw — well played':j.winner+' wins!':turn+' to play')+'</p><div class="actions"><button id="new">New round</button><label><input id="ai" type="checkbox" '+(ai?'checked':'')+'> Play computer</label></div>';document.querySelectorAll('[data-cell]').forEach(b=>b.onclick=()=>play(Number(b.dataset.cell)));document.querySelector('#new').onclick=reset;document.querySelector('#ai').onchange=e=>{ai=e.target.checked;reset()}}function reset(){board=Array(9).fill(null);turn='X';render()}function play(i){if(board[i]||judge(board))return;board[i]=turn;if(ai&&!judge(board)){let best=-Infinity,index=-1;board.forEach((v,k)=>{if(!v){board[k]='O';let s=minimax(board,'X');board[k]=null;if(s>best){best=s;index=k}}});board[index]='O'}else turn=turn==='X'?'O':'X';let j=judge(board);if(j)scores[j.winner]++;render()}render();
</script></body></html>
