<!doctype html><html lang="en"><meta charset="utf-8"><title>Save project recordings</title><style>body{background:#101710;color:#e5eedf;font:16px system-ui;padding:40px}button,a{display:inline-block;margin:12px 0;padding:12px 20px;background:#d1e0bb;color:#152010;border:0;border-radius:6px}#status{max-width:70ch}</style><h1>Save project recordings</h1><button id="export">Prepare one archive</button><p id="status">Ready to collect the existing recordings.</p><script>const recordedFiles=[];const status=document.querySelector('#status');document.querySelector('#export').onclick=async ev=>{ev.target.disabled=true;try{const list=JSON.parse(decodeURIComponent(location.hash.slice(1)));for(const f of list){if(!/^project-[a-z0-9-]+\.webm$/.test(f.name)||!f.url.startsWith('blob:https://ishmael366.github.io/'))continue;status.textContent='Collecting '+f.name;try{const response=await fetch(f.url);const blob=await response.blob();if(blob.size)recordedFiles.push({name:f.name,blob})}catch{}}status.textContent='Collected '+recordedFiles.length+' clips';await makeArchive()}catch(e){status.textContent=e.message;ev.target.disabled=false}};async function makeArchive(){const encoder=new TextEncoder(),parts=[],entries=[];let offset=0;const table=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n&1)?0xedb88320^(n>>>1):n>>>1;return n>>>0});function crc(bytes){let c=0xffffffff;for(const x of bytes)c=table[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0}function header(n){const a=new Uint8Array(n);return[a,new DataView(a.buffer)]}for(const f of recordedFiles){const data=new Uint8Array(await f.blob.arrayBuffer()),name=encoder.encode(f.name),sum=crc(data),[local,l]=header(30);l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint32(14,sum,true);l.setUint32(18,data.length,true);l.setUint32(22,data.length,true);l.setUint16(26,name.length,true);parts.push(local,name,data);const[central,c]=header(46);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint32(16,sum,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);entries.push(central,name);offset+=30+name.length+data.length}const centralSize=entries.reduce((n,a)=>n+a.length,0),[end,e]=header(22);e.setUint32(0,0x06054b50,true);e.setUint16(8,recordedFiles.length,true);e.setUint16(10,recordedFiles.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);const zip=new Blob([...parts,...entries,end],{type:'application/zip'}),a=document.createElement('a');a.href=URL.createObjectURL(zip);a.download='project-feature-recordings.zip';a.textContent='Download all recordings';a.id='download-all';document.body.prepend(a);status.textContent+=' · archive ready ('+zip.size+' bytes)'}
</script></html>
