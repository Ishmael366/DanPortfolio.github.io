<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 30% 10%,#1e3e4a,#0a121f 65%);color:#eef6ff;font:16px/1.5 system-ui;min-height:100vh}header{max-width:1050px;margin:auto;padding:22px;display:flex;justify-content:space-between}a{color:#93e9c8}main{max-width:470px;margin:25px auto;padding:25px;background:#142333;border:1px solid #355069;border-radius:20px;box-shadow:0 25px 80px #0004}h1{font-size:30px;margin:0 0 12px}button{font:inherit;cursor:pointer;border:1px solid #365368;color:#edf8ff;background:#223b50;border-radius:10px}button:hover{background:#33566d}button:focus-visible{outline:3px solid #97f6d4}#history{text-align:right;color:#8faabb;min-height:24px}#display{font:clamp(22px,7vw,45px) ui-monospace;text-align:right;overflow:auto;padding:15px 0;min-height:90px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.calc-grid button{padding:19px}.calc-grid .operator{background:#276a69}.calc-grid .equal{background:#91e4bd;color:#08241d}.calc-grid .zero{grid-column:span 2}.caption{font-size:13px;color:#9eb3c4}.scoreboard{display:flex;justify-content:space-around;margin:20px 0}.scoreboard div{text-align:center}.scoreboard small{display:block;color:#aac0cc}.scoreboard b{font-size:30px}.game-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.game-grid button{aspect-ratio:1;font-size:60px;font-weight:800}.game-grid button.X{color:#ffbc88}.game-grid button.O{color:#84e8cb}.game-grid button.win{background:#36635a}#game-status{font-size:23px;text-align:center}.actions{display:flex;justify-content:space-between;align-items:center}.actions button{padding:10px 16px}footer{max-width:470px;margin:20px auto;font-size:13px;padding:0 15px}@media(max-width:500px){main{margin:15px;border-radius:14px}.calc-grid button{padding:15px}}</style></head><body><header><a href="sports.html">Sports & Games</a><span>Interactive project</span></header><main><h1>Calculator</h1><div id="history"></div><div id="display" role="status">0</div><div class="calc-grid"><button data-key="AC" class="">AC</button><button data-key="±" class="">±</button><button data-key="%" class="">%</button><button data-key="÷" class="operator">÷</button><button data-key="7" class="">7</button><button data-key="8" class="">8</button><button data-key="9" class="">9</button><button data-key="×" class="operator">×</button><button data-key="4" class="">4</button><button data-key="5" class="">5</button><button data-key="6" class="">6</button><button data-key="−" class="operator">−</button><button data-key="1" class="">1</button><button data-key="2" class="">2</button><button data-key="3" class="">3</button><button data-key="+" class="operator">+</button><button data-key="0" class="">0</button><button data-key="." class="">.</button><button data-key="⌫" class="">⌫</button><button data-key="=" class="equal">=</button></div><p class="caption">Keyboard supported · Enter to calculate · Escape to clear.</p></main><footer><a href="https://github.com/Ishmael366/DanPortfolio.github.io/blob/main/project-javascript-calculator-source.zip">Source on GitHub</a></footer><script>const screen=document.querySelector('#display'),history=document.querySelector('#history');let value='0',stored=null,op=null,fresh=false;function show(){screen.textContent=value;history.textContent=stored===null?'':stored+' '+op}function calc(a,b,o){if(o==='÷'&&b===0)return 'Cannot divide by zero';let n=o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:a/b;return Number.isFinite(n)?String(Number(n.toPrecision(12))):'Error'}function key(k){if(k==='AC'){value='0';stored=op=null;fresh=false}else if(k==='⌫'){value=fresh?'0':value.length>1?value.slice(0,-1):'0';fresh=false}else if(k==='±'){if(!isNaN(Number(value)))value=String(-Number(value))}else if(k==='%'){if(!isNaN(Number(value)))value=String(Number(value)/100)}else if(['+','−','×','÷'].includes(k)){if(isNaN(Number(value)))return;if(stored!==null&&!fresh)value=calc(stored,Number(value),op);stored=Number(value);op=k;fresh=true}else if(k==='='){if(stored!==null&&op){value=calc(stored,Number(value),op);stored=op=null;fresh=true}}else{if(fresh||isNaN(Number(value))){value='0';fresh=false}if(k==='.'&&value.includes('.'))return;if(value.replace('-','').length>=15)return;value=value==='0'&&k!=='.'?k:value+k}show()}document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>key(b.dataset.key));onkeydown=e=>{let k={'Enter':'=','Escape':'AC','Backspace':'⌫','*':'×','/':'÷','-':'−'}[e.key]||e.key;if(/^[0-9.]$/.test(k)||['=','AC','⌫','×','÷','−','+','%'].includes(k)){e.preventDefault();key(k)}};show();
</script></body></html>
