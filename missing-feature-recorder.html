<!doctype html><html lang="en"><meta charset="utf-8"><title>Project recordings</title><style>body{background:#101410;color:#e5eddf;font:15px system-ui;padding:24px}button,a{padding:10px;background:#cfdfbc;color:#132010;border:0;border-radius:5px;cursor:pointer}iframe{width:1280px;height:720px;border:0;transform-origin:top left}#stage{width:1280px;height:720px;overflow:hidden}#results{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{background:#1b2418;padding:12px}video{width:100%;max-height:150px}a{display:inline-block;margin-top:8px}h2{font-size:15px}#status{position:sticky;top:0;background:#101410;padding:10px}</style><button id="start">Record missing project videos</button><p id="status">Ready</p><div id="stage"><iframe id="frame" allow="autoplay"></iframe></div><div id="results"></div><script src="html2canvas.min.js"></script><script>

 {"id": "project-game-python-minesweeper", "title": "Python Minesweeper", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-python-minesweeper.html"}, {"id": "project-game-react-tetris-finished", "title": "Tetris", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-react-tetris-finished.html"}, {"id": "project-project-javascript-calculator", "title": "JavaScript Calculator", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/project-javascript-calculator-demo.html"}, {"id": "project-game-frogger", "title": "Frogger", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-frogger.html"}, {"id": "project-game-battleships", "title": "Battleships", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-battleships.html"}, {"id": "project-game-kubowania--connect-four", "title": "Connect Four", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-connect-four.html"}, {"id": "project-game-kubowania--tetris-basic", "title": "Tetris Basic", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-tetris-basic.html"}, {"id": "project-game-kubowania--pac-man", "title": "Pac-Man", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-pac-man.html"}, {"id": "project-game-kubowania--zelda-js", "title": "Zelda", "demo": "https://ishmael366.github.io/DanPortfolio.github.io/game-zelda-js.html"}];const frame=document.querySelector('#frame'),status=document.querySelector('#status'),results=document.querySelector('#results');const delay=ms=>new Promise(r=>setTimeout(r,ms));let cancelled=false;
function canvases(win){let list=[];try{list=[...win.document.querySelectorAll('canvas')].map(canvas=>({canvas,win}));for(const f of win.document.querySelectorAll('iframe'))list.push(...canvases(f.contentWindow))}catch{}return list}
function dispatch(c,key,code,keyCode,down){for(const t of [c.win,c.win.document,c.canvas])try{t.dispatchEvent(new c.win.KeyboardEvent(down?'keydown':'keyup',{key,code,keyCode,which:keyCode,bubbles:true}))}catch{}}
function clickCanvas(c){const r=c.canvas.getBoundingClientRect();for(const type of ['pointerdown','mousedown','pointerup','mouseup','click'])try{c.canvas.dispatchEvent(new c.win.MouseEvent(type,{clientX:r.x+r.width/2,clientY:r.y+r.height/2,bubbles:true,button:0}))}catch{}}
async function record(g){status.textContent='Loading '+g.title;frame.src=g.demo;await new Promise((resolve,reject)=>{frame.onload=resolve;setTimeout(()=>reject(Error('Load timed out')),60000)});await delay(1500);let c;for(let n=0;n<100;n++){const list=canvases(frame.contentWindow).filter(x=>x.canvas.width>200&&x.canvas.height>100).sort((a,b)=>b.canvas.width*b.canvas.height-a.canvas.width*a.canvas.height);if(list.length){c=list[0];break}await delay(300)}
if(c){const docs=[frame.contentDocument,c.win.document];for(const doc of new Set(docs)){const loading=doc.querySelector('#unity-loading-bar,#loading-bar,.loading-bar');if(loading){for(let n=0;n<90;n++){if(c.win.getComputedStyle(loading).display==='none'||!loading.isConnected)break;await delay(500)}}}await delay(2500)}else{const doc=frame.contentDocument;const target=[...doc.querySelectorAll('#game,.game-container,.game-board,.board,.grid,#root,main')].find(el=>el.getBoundingClientRect().width>180&&el.getBoundingClientRect().height>100);if(!target)throw Error('No playable game surface');const rect=target.getBoundingClientRect(),surface=document.createElement('canvas');surface.width=Math.ceil(rect.width);surface.height=Math.ceil(rect.height);c={canvas:surface,win:frame.contentWindow,target}}
for(const doc of new Set([frame.contentDocument,c.win.document])){const start=[...doc.querySelectorAll('button')].find(b=>!b.disabled&&/^(play demo|start game|play|start|begin|new game|restart|restart game)$/i.test(b.textContent.trim()));start?.click()};if(!c.target)clickCanvas(c);await delay(800);let painting=true;async function paint(){if(!painting||!c.target)return;try{const im=await html2canvas(c.target,{logging:false,scale:1,useCORS:true,backgroundColor:'#111'});c.canvas.getContext('2d').drawImage(im,0,0)}catch{}if(painting)setTimeout(paint,100)}if(c.target)await paint();
const stream=c.canvas.captureStream(24),chunks=[],mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:3500000});recorder.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data)};const stop=new Promise(resolve=>recorder.onstop=resolve);status.textContent='Recording '+g.title;recorder.start();
const sequences=[['ArrowRight','ArrowRight',39],['w','KeyW',87],[' ','Space',32],['ArrowLeft','ArrowLeft',37],['d','KeyD',68],['ArrowDown','ArrowDown',40]];for(let i=0;i<sequences.length;i++){const keys=sequences[i];dispatch(c,...keys,true);if(i===2||i===4)clickCanvas(c);if(c.target){const cells=[...c.target.querySelectorAll('.cell,.card,.tile,.square,[data-cell],.grid img,.board button,.grid div')];cells[i%Math.max(1,cells.length)]?.click();const buttons=[...c.win.document.querySelectorAll('button')];buttons.find(b=>/^rock$/i.test(b.textContent.trim()))?.click();const number=c.win.document.querySelector('input[type=number]');if(number){const setter=Object.getOwnPropertyDescriptor(c.win.HTMLInputElement.prototype,'value').set;setter.call(number,String(i+3));number.dispatchEvent(new c.win.Event('input',{bubbles:true}));number.dispatchEvent(new c.win.Event('change',{bubbles:true}));buttons.find(b=>/^(guess|check)$/i.test(b.textContent.trim()))?.click()}}await delay(1800);dispatch(c,...keys,false)}recorder.stop();await stop;painting=false;stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:mime});const card=document.createElement('article');card.dataset.project=g.id;const h=document.createElement('h2');h.textContent=g.title;const v=document.createElement('video');v.controls=true;v.muted=true;v.src=URL.createObjectURL(blob);const a=document.createElement('a');a.href=v.src;a.download=g.id+'.webm';a.textContent='Download '+g.title;card.append(h,v,a);results.append(card);return blob.size}
document.querySelector('#start').onclick=async ev=>{ev.target.disabled=true;let count=0;for(const g of games){try{await record(g);count++}catch(e){const p=document.createElement('p');p.textContent=g.title+': '+e.message;results.append(p)}status.textContent='Captured '+count+' / '+games.length;frame.src='about:blank';await delay(400)}status.textContent='Finished: '+count+' / '+games.length;ev.target.disabled=false};
</script></html>
