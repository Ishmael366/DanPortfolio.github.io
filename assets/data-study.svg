  <g fill="none" stroke="#607f59" stroke-opacity=".55" stroke-width="1.1">
    <path d="M83 136H65V160M813 98H837V122M83 477H65V453M826 525H844V501"/>
    <path d="M98 548H287" stroke-opacity=".25"/>
  </g>
  <text x="62" y="561" fill="#63785c" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2.3">QUERY · EXPLORE · VISUALIZE</text>
  <path d="M798 555H837M825 543L837 555L825 567" fill="none" stroke="#718d63" stroke-width="1.2"/>
</svg>
