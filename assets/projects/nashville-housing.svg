<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Nashville property records illustration</title>
  <desc id="desc">A schematic street and parcel grid with house plans, linked to a property record form with address, sale date, and parcel fields. No real parcels or records are shown.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f1e2"/><stop offset="1" stop-color="#dde4d6"/></linearGradient>
    <pattern id="grid" width="19" height="19" patternUnits="userSpaceOnUse"><path d="M19 0H0V19" fill="none" stroke="#607a65" stroke-opacity=".12"/></pattern>
    <g id="house" stroke="#445d50" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="m-14 0 14-12L14 0v13h-28Z" fill="#f0ebd7"/><path d="M-4 13V5h8v8M-16 2 0-12 16 2" fill="none"/>
    </g>
  </defs>
  <rect width="720" height="440" fill="url(#paper)"/>
  <rect x="23" y="23" width="674" height="394" fill="url(#grid)" stroke="#7d9480" stroke-opacity=".38"/>
  <g transform="translate(44 50) rotate(-10 184 159)">
    <rect x="14" y="17" width="334" height="286" fill="#d2d9c2" stroke="#71876d"/>
    <g fill="#aab89d" stroke="#6d866d" stroke-width="1">
