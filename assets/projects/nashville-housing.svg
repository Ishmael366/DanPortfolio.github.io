      <path d="M25 203h91v83H25zm97 0h60v83h-60zm81 0h53v83h-53zm59 0h73v83h-73z"/>
      <path d="M90 111h92v66H90Z" fill="#b27a60" stroke="#8a5646" stroke-width="2"/>
    </g>
    <path d="M15 98h333M15 190h333M192 17v286" stroke="#faf4df" stroke-width="15"/>
    <path d="M15 98h333M15 190h333M192 17v286" stroke="#82947e" stroke-dasharray="3 5" fill="none"/>
    <use href="#house" x="66" y="55"/><use href="#house" x="146" y="58"/><use href="#house" x="235" y="58"/><use href="#house" x="302" y="59"/>
    <use href="#house" x="53" y="143"/><use href="#house" x="136" y="143"/><use href="#house" x="238" y="142"/><use href="#house" x="309" y="142"/>
    <use href="#house" x="71" y="240"/><use href="#house" x="150" y="239"/><use href="#house" x="229" y="242"/><use href="#house" x="298" y="242"/>
    <circle cx="136" cy="144" r="25" fill="none" stroke="#f9efda" stroke-width="1.5" stroke-dasharray="3 4"/>
  </g>
  <path d="M183 199h149l90-46" fill="none" stroke="#965d49" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="183" cy="199" r="4" fill="#965d49" stroke="#f7f1e2" stroke-width="2"/>
  <g transform="translate(402 86)">
