<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc">
  <title id="title">COVID-19 public health analysis illustration</title>
  <desc id="desc">An abstract world globe beside three report panels for cases, deaths, and vaccination, with an unnumbered calendar strip. The marks are illustrative.</desc>
