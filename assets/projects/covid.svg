    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#d8e0c6" stroke-opacity=".10"/></pattern>
    <clipPath id="globe"><circle cx="253" cy="203" r="148"/></clipPath>
